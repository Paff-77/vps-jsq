<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPShub</title>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-3 md:p-4 text-gray-800 dark:text-gray-300">

    <main class="w-full max-w-4xl relative">
        
        <div class="flex items-end justify-between mb-3 md:mb-4 px-1 md:px-2">
            <div class="flex items-center gap-3">
                <h1 class="text-xl md:text-3xl font-bold text-gray-800 dark:text-white tracking-normal transition-colors flex items-center leading-none">
                    <span class="text-black dark:text-white">VPS</span>
                    <span class="text-accent-500 ml-1">hub</span>
                </h1>
            </div>
            
            <button id="themeToggle" class="relative inline-flex h-6 w-11 items-center rounded-full bg-gray-300 dark:bg-gray-700 transition-colors focus:outline-none shadow-inner" title="切换深色/浅色模式">
                <span id="themeToggleKnob" class="inline-block h-4 w-4 transform rounded-full bg-white shadow transition-transform duration-200 translate-x-1 dark:translate-x-6 flex items-center justify-center">
                    <!-- Moon Icon -->
                    <svg class="w-3 h-3 text-gray-600 hidden dark:block" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                    <!-- Sun Icon -->
                    <svg class="w-3 h-3 text-accent-500 dark:hidden" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100 2h1a1 1 0 100-2h-1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"></path></svg>
                </span>
            </button>
        </div>

        <div id="mainCard" class="relative rounded-xl overflow-hidden flex flex-col md:flex-row transition-all duration-300 shadow-xl dark:shadow-none metal-card-border bg-white dark:bg-black border border-gray-200 dark:border-gray-800">
            
            <!-- Classic Yellow Top Bar -->
            <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-accent-500 to-accent-400 z-20 shadow-sm">
            </div>
            
            <!-- 左侧：输入区域，移动端 padding 改为 p-3 (12px) -->
            <section class="w-full md:w-[60%] p-3 md:p-8 pt-5 md:pt-10 border-b md:border-b-0 md:border-r border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-black transition-colors">
                <form id="calcForm" class="space-y-3 md:space-y-6">
                    
                    <div class="flex flex-row gap-3 md:gap-6">
                        <div class="w-[60%] group">
                            <div class="flex justify-between items-end mb-1 md:mb-2 h-4">
                                <label class="text-[10px] md:text-xs text-gray-500 dark:text-gray-400 uppercase font-bold group-focus-within:text-accent-500 leading-none transition-colors">💰 续费金额</label>
                                <span id="priceCNYPreview" class="text-[10px] md:text-xs font-mono text-gray-400 dark:text-gray-500 font-bold leading-none transition-colors whitespace-nowrap">≈0.00元</span>
                            </div>
                            <div class="relative">
                                <span class="symbol-display absolute left-3 md:left-4 top-1/2 -translate-y-1/2 text-accent-500 font-mono text-base md:text-lg z-10 pointer-events-none transition-colors font-bold">$</span>
                                <input type="number" id="price" step="0.01" 
                                    class="w-full h-10 md:h-12 pl-12 md:pl-14 pr-2 md:pr-4 rounded text-base md:text-xl font-mono font-medium tracking-wide transition-all outline-none bg-white border border-gray-300 text-gray-800 focus:border-accent-500 focus:ring-1 focus:ring-accent-500/20 dark:bg-[#1a1a1a] dark:border-gray-700 dark:text-gray-200 dark:focus:border-accent-500 dark:focus:ring-0" 
                                    placeholder="0.00">
                            </div>
                        </div>

                        <div class="w-[40%] group">
                            <div class="flex justify-between items-end mb-1 md:mb-2 h-4">
                                <label class="text-[10px] md:text-xs text-gray-500 dark:text-gray-400 uppercase font-bold group-focus-within:text-accent-500 leading-none transition-colors">📊 币种</label>
                            </div>
                            <div class="relative">
                                <select id="currency" 
                                    class="w-full h-10 md:h-12 pl-2 md:pl-4 pr-8 rounded text-sm md:text-base font-medium cursor-pointer appearance-none transition-all outline-none bg-white border border-gray-300 text-gray-800 focus:border-accent-500 dark:bg-[#1a1a1a] dark:border-gray-700 dark:text-gray-200 dark:focus:border-accent-500">
                                    <option value="CNY">CNY 人民币</option>
                                    <option value="USD" selected>USD 美元</option>
                                    <option value="EUR">EUR 欧元</option>
                                    <option value="GBP">GBP 英镑</option>
                                    <option value="JPY">JPY 日元</option>
                                    <option value="KRW">KRW 韩元</option>
                                    <option value="HKD">HKD 港元</option>
                                    <option value="TWD">TWD 新台币</option>
                                    <option value="CAD">CAD 加拿大元</option>
                                    <option value="SGD">SGD 新加坡元</option>
                                    <option value="AUD">AUD 澳大利亚元</option>
                                </select>
                                <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-gray-400 dark:text-gray-500 text-xs transition-colors">
                                    <!-- Chevron Down Icon -->
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="text-[10px] md:text-xs text-gray-500 dark:text-gray-400 uppercase font-bold mb-1 md:mb-2 block transition-colors">📅 付款周期</label>
                        <div class="grid grid-cols-3 sm:grid-cols-6 gap-1.5 md:gap-3">
                            <label class="cursor-pointer relative"><input type="radio" name="cycle" value="30" class="cycle-radio sr-only"><div class="py-1.5 md:py-2.5 text-center rounded text-xs md:text-sm transition-all border bg-white border-gray-200 text-gray-500 hover:bg-gray-100 dark:bg-[#1a1a1a] dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:border-gray-600">月付</div></label>
                            <label class="cursor-pointer relative"><input type="radio" name="cycle" value="90" class="cycle-radio sr-only"><div class="py-1.5 md:py-2.5 text-center rounded text-xs md:text-sm transition-all border bg-white border-gray-200 text-gray-500 hover:bg-gray-100 dark:bg-[#1a1a1a] dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:border-gray-600">季付</div></label>
                            <label class="cursor-pointer relative"><input type="radio" name="cycle" value="180" class="cycle-radio sr-only"><div class="py-1.5 md:py-2.5 text-center rounded text-xs md:text-sm transition-all border bg-white border-gray-200 text-gray-500 hover:bg-gray-100 dark:bg-[#1a1a1a] dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:border-gray-600">半年</div></label>
                            <label class="cursor-pointer relative"><input type="radio" name="cycle" value="365" class="cycle-radio sr-only" checked><div class="py-1.5 md:py-2.5 text-center rounded text-xs md:text-sm transition-all border bg-white border-gray-200 text-gray-500 hover:bg-gray-100 dark:bg-[#1a1a1a] dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:border-gray-600">年付</div></label>
                            <label class="cursor-pointer relative"><input type="radio" name="cycle" value="730" class="cycle-radio sr-only"><div class="py-1.5 md:py-2.5 text-center rounded text-xs md:text-sm transition-all border bg-white border-gray-200 text-gray-500 hover:bg-gray-100 dark:bg-[#1a1a1a] dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:border-gray-600">两年</div></label>
                            <label class="cursor-pointer relative"><input type="radio" name="cycle" value="1095" class="cycle-radio sr-only"><div class="py-1.5 md:py-2.5 text-center rounded text-xs md:text-sm transition-all border bg-white border-gray-200 text-gray-500 hover:bg-gray-100 dark:bg-[#1a1a1a] dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:border-gray-600">三年</div></label>
                        </div>
                    </div>

                    <div class="flex flex-row gap-3 md:gap-6">
                        <div class="w-1/2 group">
                            <label class="text-[10px] md:text-xs text-gray-500 dark:text-gray-400 uppercase font-bold mb-1 md:mb-2 block group-focus-within:text-accent-500 transition-colors">⌛ 到期日期</label>
                            <input type="date" id="dueDate" class="w-full h-10 md:h-12 px-2 md:px-4 rounded text-xs md:text-sm font-mono font-medium transition-all outline-none bg-white border border-gray-300 text-gray-800 focus:border-accent-500 dark:bg-[#1a1a1a] dark:border-gray-700 dark:text-gray-300 dark:focus:border-accent-500">
                        </div>
                        <div class="w-1/2 group">
                            <label class="text-[10px] md:text-xs text-gray-500 dark:text-gray-400 uppercase font-bold mb-1 md:mb-2 block group-focus-within:text-accent-500 transition-colors">🤝 交易日期</label>
                            <input type="date" id="tradeDate" class="w-full h-10 md:h-12 px-2 md:px-4 rounded text-xs md:text-sm font-mono font-medium transition-all outline-none bg-white border border-gray-300 text-gray-800 focus:border-accent-500 dark:bg-[#1a1a1a] dark:border-gray-700 dark:text-gray-300 dark:focus:border-accent-500">
                        </div>
                    </div>

                    <div class="flex items-center justify-between pt-3 md:pt-5 border-t border-gray-200 dark:border-gray-800 transition-colors">
                        <div class="flex items-center gap-2 md:gap-3">
                            <span class="text-[10px] md:text-xs text-gray-500 dark:text-gray-400 font-bold uppercase transition-colors">💹 CNY 汇率</span>
                            <input type="number" id="customRate" step="0.0001" class="w-16 md:w-24 text-sm md:text-base font-mono font-bold text-center border-b outline-none py-1 transition-colors bg-transparent border-gray-400 text-accent-600 focus:border-accent-500 dark:border-gray-600 dark:text-accent-500 dark:focus:border-accent-500" placeholder="0.00">
                        </div>
                        
                        <div class="flex items-center gap-2 md:gap-3 relative">
                            <button type="button" id="refreshRateBtn" class="text-[10px] md:text-xs text-gray-500 dark:text-gray-400 hover:text-accent-500 transition-colors flex items-center gap-1.5">
                                <span id="apiRateDisplay" class="hidden sm:inline">--</span>
                                <!-- Refresh Icon (SVG) with id for JS targeting -->
                                <svg id="refreshIcon" class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                            </button>
                            <div class="h-3 w-px bg-gray-300 dark:bg-gray-700 transition-colors"></div>
                            <a href="https://www.exchangerate-api.com" target="_blank" class="text-[10px] md:text-xs text-gray-500 dark:text-gray-600 hover:text-accent-500 transition-colors underline decoration-gray-300 dark:decoration-gray-800 hover:decoration-accent-500/50">来源</a>
                        </div>
                    </div>
                </form>
            </section>

            <!-- 右侧：结果展示，移动端 padding 改为 p-3 (12px) -->
            <section id="resultCard" class="w-full md:w-[40%] bg-white dark:bg-[#1a1a1a] p-3 md:p-8 pt-5 md:pt-10 flex flex-col relative transition-colors duration-300">
                <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-gray-100/50 dark:from-gray-800/20 via-transparent to-transparent opacity-50 pointer-events-none transition-colors"></div>

                <!-- 增加 px-1 (4px) 左右间隙 -->
                <div class="relative z-10 w-full flex-1 flex flex-col justify-center px-1">
                    <div class="text-right mb-1">
                        <h2 class="text-[10px] md:text-xs text-gray-400 dark:text-gray-500 uppercase tracking-widest font-bold mb-1 transition-colors">剩余价值 (RMB)</h2>
                        <div class="flex items-baseline justify-end gap-1">
                            <span class="text-2xl md:text-3xl text-accent-500 font-light transition-colors">¥</span>
                            <span id="finalValue" class="text-4xl md:text-6xl lg:text-7xl font-mono font-bold value-glow tracking-tighter leading-none transition-colors whitespace-nowrap">0.00</span>
                        </div>
                        <div id="originalCurrencyValue" class="text-xs md:text-sm text-gray-500 dark:text-gray-600 font-mono mt-0 transition-colors whitespace-nowrap">≈ 0.00 USD</div>
                    </div>

                    <div class="w-full h-px bg-gray-200 dark:bg-gray-800 my-2 md:my-4 transition-colors"></div>

                    <div class="mb-2">
                        <div class="flex items-center justify-between mb-1 md:mb-2">
                            <div class="text-[10px] md:text-xs text-gray-500 dark:text-gray-400 font-bold uppercase transition-colors">⏳ 剩余天数</div>
                            <div id="progressText" class="text-[10px] md:text-xs font-mono text-accent-500 font-bold">0%</div>
                        </div>
                        
                        <div class="flex items-center gap-3">
                            <div class="whitespace-nowrap text-xl md:text-2xl font-mono text-gray-700 dark:text-gray-200 leading-none transition-colors">
                                <span id="daysRemaining">0</span> <span class="text-[10px] md:text-xs text-gray-400 dark:text-gray-600 ml-0.5">DAYS</span>
                            </div>
                            <div class="flex-1 progress-container h-2 md:h-1.5 rounded-full overflow-hidden transition-colors bg-gray-200 dark:bg-gray-800">
                                <div id="progressBar" class="progress-fill h-full w-0 transition-all duration-700 ease-out rounded-full"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="btnContainer" class="relative z-10 mt-2 md:mt-auto pt-2 flex justify-center gap-3">
                    <button id="copyBtn" onclick="copyResult()" title="复制 Markdown 格式" class="w-full md:w-auto px-6 py-2 rounded border transition-all flex items-center justify-center gap-2 group bg-gray-50 border-gray-300 text-gray-500 hover:bg-white hover:text-accent-500 hover:border-accent-400 dark:bg-gray-800/50 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-accent-500 dark:hover:border-accent-500/50 text-xs">
                        <!-- Copy Icon (SVG) -->
                        <svg class="w-3 h-3 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        <span>复制详情</span>
                    </button>
                    <button id="imgBtn" onclick="generateImage()" title="生成 SVG 图片" class="w-full md:w-auto px-6 py-2 rounded border transition-all flex items-center justify-center gap-2 group bg-gray-50 border-gray-300 text-gray-500 hover:bg-white hover:text-accent-500 hover:border-accent-400 dark:bg-gray-800/50 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-accent-500 dark:hover:border-accent-500/50 text-xs">
                        <!-- Image Icon (SVG) -->
                        <svg class="w-3 h-3 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        <span>生成图片</span>
                    </button>
                </div>
                
                <div id="toast" class="absolute bottom-16 left-1/2 -translate-x-1/2 bg-accent-500 text-white dark:text-black text-xs font-bold px-3 py-1.5 rounded shadow-lg pointer-events-none z-20 transition-colors">已复制到剪贴板</div>
            </section>
        </div>

        <div class="mt-2 text-center">
            <span class="text-[10px] md:text-sm text-gray-400 dark:text-gray-600 font-mono transition-colors">Ver 1.1 // By <a href="https://www.xiaoge.org/" target="_blank" class="hover:text-accent-500 transition-colors">XiaoGe</a>. <a href="https://github.com/verkyer/vps-jsq" target="_blank" class="hover:text-accent-500 transition-colors">vps-jsq</a></span>
        </div>

    </main>

    <div id="imageModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 transition-all duration-300 opacity-0">
        <div class="relative w-full max-w-4xl flex flex-col items-center">
            <button onclick="closeImageModal()" class="absolute -top-12 right-0 text-white hover:text-accent-500 transition-colors text-2xl p-2">
                <!-- X Icon -->
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            
            <div id="modalLoading" class="text-white flex flex-col items-center gap-3">
                <!-- Spinner Icon -->
                <svg class="animate-spin h-8 w-8 text-accent-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                <span class="text-sm font-mono">Generating Image...</span>
            </div>

            <img id="generatedImage" class="w-full h-auto rounded-xl shadow-2xl hidden" alt="Result Preview">
            
            <div id="modalActions" class="mt-6 flex gap-4 hidden">
                <p class="text-white/60 text-xs md:text-sm font-mono mt-2 flex items-center">
                    <!-- Info Icon -->
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    长按图片保存或复制
                </p>
            </div>
        </div>
    </div>

    <div id="rateLimitTip" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-accent-500/80 backdrop-blur-sm text-white px-8 py-5 rounded-xl shadow-[0_0_30px_rgba(255,147,0,0.4)] text-base font-bold tracking-wider z-50 text-center min-w-[240px] border border-white/20">
        <button onclick="hideRateLimitTip()" class="absolute top-2 right-3 text-white/70 hover:text-white transition-colors text-sm" title="关闭">
            <!-- X Icon -->
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        <div class="flex items-center justify-center text-lg font-bold">
            <!-- Warning Icon -->
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            请勿频繁刷新
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
